// Seamless settings. Read again whenever a shot or a transition starts (no restart needed).
// Times in seconds, screen positions as fractions of the screen (0..1 from the left / bottom).
SEAMLESS
{
	enabled = True

	// Length of every transition leg (camera flights, zooms, holds, card fades): 1 = as designed,
	// 1.5 = half again as long (slower), 0.75 = quicker. Waits for a scene to finish loading
	// are not changed.
	transitionTimeScale = 1

	// --- Arrival shot ---------------------------------------------------------------------
	// When a vessel is captured by a body for the first time (closed orbit inside its sphere of
	// influence, out of the atmosphere), the camera pulls away into a letterboxed shot of the
	// body with its name and orbit, then flies back.

	// Engines off for this long before the shot starts.
	quietSeconds = 1
	// Also play the shot for stars (e.g. after leaving the home planet's sphere of influence).
	includeStars = False
	approachSeconds = 5
	holdSeconds = 7
	returnSeconds = 3.5
	// Text beside the planet.
	showApPe = True
	showMissionTime = True
	// A small ring and the vessel's name where the vessel is when it is too small to see.
	showVesselMarker = True

	// --- Framing (all planet shots, also in the transitions) ---------------------------
	// Planet diameter as a fraction of the height between the black bars (above 1 it runs
	// off the top and bottom of the picture), and its centre from the left edge.
	planetFraction = 0.9
	planetScreenX = 0.3
	// Height of each black bar, as a fraction of the screen height.
	barFraction = 0.12
	// Vertical field of view (degrees), and the narrowest one for telephoto shots.
	cameraFov = 50
	minFov = 0.5
	// Where the vessel goes when it is in the shot (towards the lower right), and its size when
	// the camera stays close behind it.
	vesselScreenX = 0.64
	vesselScreenY = 0.34
	vesselFraction = 0.10
	// For a vessel high above the planet the camera pulls back (the planet gets smaller) until
	// the vessel fits in the shot - at most this many times further than the framing above.
	maxZoomOut = 4
	// Slow zoom during the hold (fraction of the field of view).
	pushIn = 0.04
	// Star brightness during a shot (1 = unchanged), and the narrowest field of view the
	// skybox is zoomed to (it blurs beyond that).
	skyboxBrightness = 0.35
	skyboxMinFov = 25

	// --- Lighting ------------------------------------------------------------------------
	// True: planets are lit from the right with the dark edge on the left - the camera sits
	// sunSideAngle degrees from the sun as seen from the planet (53 = about a fifth of the disc
	// dark, 0 = fully lit, 90 = half lit), keeping the vessel in view where it can. False: the
	// camera stays on the vessel's side of the planet, turned at most maxSunAngle degrees
	// towards the sun.
	sunFromTextSide = True
	sunSideAngle = 53
	maxSunAngle = 50

	// --- Loading-screen transitions (need Harmony) ----------------------------------------
	// Loading screens become camera moves: the camera flies to the destination, the loading
	// card holds the last frame, and the new scene opens on the same view.
	spaceCenterTransition = True            // flight -> Space Center
	trackingStationTransition = True        // flight -> Tracking Station
	vesselSwitchTransition = True           // switching to a vessel that is not loaded
	flyFromSpaceCenter = True               // Space Center -> a vessel (markers, pad, runway)
	flyFromTrackingStation = True           // Tracking Station "Fly"
	editorTransition = True                 // Space Center -> VAB / SPH
	editorExitTransition = True             // VAB / SPH -> Space Center
	trackingFromSpaceCenter = True          // Space Center -> Tracking Station
	spaceCenterFromTrackingStation = True   // Tracking Station -> Space Center
	launchTransition = True                 // launches (VAB / SPH, Kerbal Construction Time)
	saveLoadTransition = True               // main menu -> a save

	// Before the load the camera turns to face the destination (within departTurnSeconds, however
	// long the trip) and flies to it: longer for longer trips, between departSeconds and
	// departMaxSeconds. The flight's speed is capped at flightMaxRate (view change per second:
	// e-folds of distance to the nearer planet plus radians of turn) and its acceleration at
	// flightMaxAccel. The defaults keep the moves short (the load waits for them): about 1.5-3 s
	// near a planet, up to 6 s between planets. Lower the last two for slower, gentler moves.
	departTurnSeconds = 1
	departSeconds = 1.5
	departMaxSeconds = 6
	flightMaxRate = 5
	flightMaxAccel = 6
	// Launches and loading a save: how long the card shows over the current view first.
	launchHoldSeconds = 0.5
	saveHoldSeconds = 0.5
	// Arriving at a vessel: hold on the opening shot, then zoom into the normal camera view.
	establishSeconds = 0
	zoomInSeconds = 2.5
	// The zoom ends looking at the vessel from the opening shot's side (a straight push in).
	// False: it ends on the camera angle the game picked when the vessel loaded.
	keepShotAngle = True
	// The loading card shows at least this long, even when the load is faster.
	loadingMinSeconds = 0

	// --- Loading -----------------------------------------------------------------------------
	// Show the new scene as soon as it can be drawn, while KSP still finishes loading it behind
	// its (now invisible) loading screen. False: wait for KSP's loading screen to end.
	liveLoading = True
	// Read the new scene in the background while the camera move plays, and skip KSP's empty
	// in-between scene. The old scene's memory is freed just after the switch instead of just
	// before it: set False if the game runs out of memory at scene changes.
	preloadScene = True
	// Switching to a craft in space (not landed, flying or inside an atmosphere): the camera flies
	// straight to the craft and KSP switches to it in place on the way - no scene reload, no card.
	// False: KSP reloads the flight scene.
	inSceneSwitch = True
	// With preloadScene: each load is timed (GameData/Seamless/PluginData/loadtimes.cfg, the last
	// three per kind of transition) and the next one planned from that. The camera move never
	// gets faster than the settings above; it is lengthened only while the scene is still being
	// read in the background, so the card shows about cardTargetSeconds (at most
	// dynamicMaxSeconds of move). What KSP does after the switch cannot be covered by a longer
	// move. When the load is expected to be over within cardSkipSeconds of the switch, there is no
	// card at all (it comes back if the load runs long after all; 0 = always a card). Loads that
	// end on a craft always keep their card (the planet shot with the craft's details).
	dynamicTiming = True
	cardTargetSeconds = 5
	cardSkipSeconds = 1.5
	dynamicMaxSeconds = 30
	// Arriving at the Space Center: hidden by the card, the camera first waits at the Space
	// Center's own view for at least warmUpSeconds until the scene has settled (KSP's loading
	// screen over, smooth frames, the log quiet for settleQuietSeconds while clouds, terrain and
	// textures load; at most settleMaxSeconds), so the terrain and clouds there are built before
	// the zoom arrives; then the card dissolves and the zoom down starts at once (0 = no wait).
	settleQuietSeconds = 0.5
	settleMaxSeconds = 30
	warmUpSeconds = 0.5

	// --- Keys (Unity KeyCode names) ------------------------------------------------------
	// Ends a shot or transition early (Escape and a left click also do).
	skipKey = Space
	// Plays the arrival shot for the current body at any time (not counted as an arrival).
	// None = off.
	previewKey = KeypadMultiply

	// Extra checks in KSP.log.
	debugLog = False
}
